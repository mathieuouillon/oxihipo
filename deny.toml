# cargo-deny configuration — run in CI as
# `cargo deny check advisories licenses bans sources`.

[advisories]
# Fail on any known vulnerability or unmaintained crate in the tree.
yanked = "deny"

[licenses]
# Permissive licences only; the crate itself is MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions of the same crate bloat the build; warn rather than fail so
# a transitive bump doesn't block CI, but keep it visible.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
