[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "oxihipo"
version = "0.1.1"
description = "Fast columnar reading of HIPO (CLAS12) files, powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mathieu Ouillon" }]
keywords = ["hipo", "clas12", "jefferson-lab", "awkward", "columnar", "physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
]
# Every backend by default: `pip install oxihipo` should give a package where
# each documented `library=` value works, rather than one where `arrays()` —
# the headline API — raises ImportError until the user finds the right extra.
#
# The imports stay lazy in the code, so `import oxihipo` still does not pay for
# awkward/pandas/pyarrow unless a call actually reaches them. This only changes
# what pip resolves.
#
# Note pip has no way to opt *out* of a default dependency: anyone who needs
# the old numpy-only footprint installs with `--no-deps` and adds numpy.
dependencies = ["numpy>=1.24", "awkward>=2.6", "pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
# Kept so existing `oxihipo[awkward]` / `[all]` commands and pinned CI recipes
# keep resolving; the defaults above already satisfy them, so they are no-ops.
awkward = ["awkward>=2.6"]
pandas = ["awkward>=2.6", "pandas>=2.0"]
arrow = ["pyarrow>=14"]
# `dask` = the lazy `to_dask()` bridge. Deliberately *not* a default: it is a
# large dependency and only pays off with a cluster or an existing dask graph;
# `iterate()` / `workers=` cover single-machine scans with no extra install.
dask = ["dask-awkward>=2024.2"]
# `root` = the ROOT RDataFrame bridge. Awkward's ROOT interop generates the
# RDataSource, so it's the pip-installable part; ROOT/PyROOT itself is NOT on
# PyPI — install it via conda-forge or your system so `import ROOT` works.
# This is the one extra still worth naming: it documents that split.
root = ["awkward>=2.6"]
all = ["awkward>=2.6", "pandas>=2.0", "pyarrow>=14", "dask-awkward>=2024.2"]

[project.urls]
Homepage = "https://mathieuouillon.github.io/oxihipo/"
Documentation = "https://mathieuouillon.github.io/oxihipo/docs/python/reading"
Repository = "https://github.com/mathieuouillon/oxihipo"
Changelog = "https://github.com/mathieuouillon/oxihipo/blob/main/CHANGELOG.md"
Issues = "https://github.com/mathieuouillon/oxihipo/issues"

[tool.maturin]
# The compiled extension is `oxihipo._oxihipo`; the pure-Python ergonomics
# (Awkward assembly, uproot-style API) live in `python/oxihipo/`.
python-source = "python"
module-name = "oxihipo._oxihipo"
features = ["pyo3/extension-module"]

[tool.mypy]
files = ["python/oxihipo"]
# Minimum supported interpreter — check the code against 3.13 semantics.
python_version = "3.13"
# awkward/pandas/pyarrow are optional runtime deps imported lazily; don't fail
# type-checking when their stubs aren't installed.
ignore_missing_imports = true
