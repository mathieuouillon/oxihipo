name: wheels

# Build (and, on a tag, publish) the `oxihipo` Python wheels. The extension is
# abi3 (one cp310-abi3 wheel per OS/arch works on CPython >= 3.10). It links the
# C LZ4 backend (`lz4-sys`), so builds need a C compiler; every native runner
# here has one, and the aarch64 Linux wheel builds on a native ARM64 runner
# rather than cross-compiling (see the `linux` job).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Native build + the full pytest suite on each OS — fast confidence that the
  # binding imports and behaves, before spending time on the cross wheels.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor on every OS — that is where a 3.11+ construct would first
        # bite — plus the newest interpreter on Linux, which is what most users
        # actually run. Matrixing all four everywhere doubles the bill for
        # little extra signal.
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-14, python: "3.10" }
          - { os: windows-latest, python: "3.10" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: py
      - name: Build the extension (native)
        working-directory: py
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist -i python
      - name: Install wheel + test dependencies
        run: |
          python -m pip install numpy awkward pandas pyarrow pytest "mypy~=2.3"
          python -m pip install --no-index --find-links py/dist oxihipo --no-deps
      - name: Run the binding's test suite
        run: python -m pytest py/tests -q
      - name: Type-check the pure-Python package (mypy)
        working-directory: py
        run: python -m mypy
      - name: Check the compiled stub matches the extension (stubtest)
        working-directory: py
        run: python -m mypy.stubtest oxihipo._oxihipo
      - name: Assert the py.typed marker ships in the wheel (PEP 561)
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("py/dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith("oxihipo/py.typed") for n in names), \
              f"py.typed missing from {whl}: {names}"
          print("py.typed present in", whl)
          PY

  linux:
    name: wheels linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          # Build aarch64 on a native ARM64 runner (free for public repos)
          # rather than cross-compiling: the `lz4-sys` C dependency has no
          # aarch64 cross-compiler in the default manylinux-auto environment.
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: py
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
          sccache: "true"
      # Building an artifact nobody installs proves only that the compiler ran.
      # Install it and use it. (Skipped when cross-compiling: the wheel does not
      # run on the builder.)
      - name: Install the wheel and use it
        if: true
        shell: bash
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q py/dist/*.whl
          python - <<'PY'
          import oxihipo
          f = oxihipo.open("py/tests/data/sample.hipo")
          assert f.num_entries == 8, f.num_entries
          assert len(f.arrays("REC::Particle", ["pid"])) == 8
          print("imported oxihipo", oxihipo.__version__, "and read a file")
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.target }}
          path: py/dist

  macos:
    name: wheels macos ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: py
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      # Building an artifact nobody installs proves only that the compiler ran.
      # Install it and use it. (Skipped when cross-compiling: the wheel does not
      # run on the builder.)
      - name: Install the wheel and use it
        if: ${{ matrix.target == 'aarch64' }}
        shell: bash
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q py/dist/*.whl
          python - <<'PY'
          import oxihipo
          f = oxihipo.open("py/tests/data/sample.hipo")
          assert f.num_entries == 8, f.num_entries
          assert len(f.arrays("REC::Particle", ["pid"])) == 8
          print("imported oxihipo", oxihipo.__version__, "and read a file")
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-macos-${{ matrix.target }}
          path: py/dist

  windows:
    name: wheels windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: py
          target: x64
          args: --release --out dist
          sccache: "true"
      # Building an artifact nobody installs proves only that the compiler ran.
      # Install it and use it. (Skipped when cross-compiling: the wheel does not
      # run on the builder.)
      - name: Install the wheel and use it
        if: true
        shell: bash
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q py/dist/*.whl
          python - <<'PY'
          import oxihipo
          f = oxihipo.open("py/tests/data/sample.hipo")
          assert f.num_entries == 8, f.num_entries
          assert len(f.arrays("REC::Particle", ["pid"])) == 8
          print("imported oxihipo", oxihipo.__version__, "and read a file")
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-windows-x64
          path: py/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: py
          command: sdist
          args: --out dist
      # An sdist that cannot be rebuilt is not a distribution, and the rebuild
      # re-roots pyproject.toml — which is how the wheel ended up advertising
      # the Rust README while the direct build advertised the Python one.
      - name: Rebuild the sdist into a wheel and check its metadata
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin -q
          mkdir -p /tmp/sd && tar xzf py/dist/*.tar.gz -C /tmp/sd
          (cd /tmp/sd/*/ && maturin build --release --out /tmp/sd/wheel)
          python -m pip install -q /tmp/sd/wheel/*.whl
          python - <<'PY'
          import glob, zipfile, oxihipo
          w = glob.glob("/tmp/sd/wheel/*.whl")[0]
          z = zipfile.ZipFile(w)
          meta = z.read([n for n in z.namelist() if n.endswith("METADATA")][0]).decode()
          body = meta.split("\n\n", 1)[1]
          first = next(l for l in body.splitlines() if l.strip())
          assert first.startswith("# oxihipo (Python)"), (
              f"the sdist-built wheel advertises the wrong README: {first!r}")
          assert any(n.endswith("licenses/LICENSE.txt") for n in z.namelist()), "no licence in the wheel"
          f = oxihipo.open("py/tests/data/sample.hipo")
          assert f.num_entries == 8
          print("sdist rebuilds, imports, and carries the right metadata")
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-sdist
          path: py/dist

  # Fail fast if the pushed tag doesn't match the packaged version, before the
  # (irreversible) publish. `v0.1.0` must match `version` in py/pyproject.toml.
  tag-check:
    name: tag matches version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert tag == pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(grep -m1 '^version' py/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag  pyproject=$proj"
          test "$tag" = "$proj" || { echo "::error::tag v$tag does not match py/pyproject.toml version $proj"; exit 1; }

  # Publish to PyPI on a version tag via Trusted Publishing (OIDC) — no stored
  # token. One-time setup: on PyPI add a "pending publisher" for project
  # `oxihipo`, repo `mathieuouillon/oxihipo`, workflow `wheels.yml`, environment
  # `pypi`. The OIDC `id-token` below is exchanged for a short-lived upload
  # credential; PEP 740 attestations are generated automatically.
  release:
    name: publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tag-check, test, linux, macos, windows, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/oxihipo
    permissions:
      id-token: write # mint the OIDC token Trusted Publishing verifies
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true # flatten every artifact into dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
