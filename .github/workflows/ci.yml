name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Lint + the full test suite on every OS. Endianness, alignment and the
  # `unsafe` decode paths are target-sensitive, so Linux alone is not enough:
  # macOS is the `lz4-apple` target and Windows is the only MSVC toolchain.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # `--all-targets` compiles the doctests but never runs them, so a broken
      # `///` example ships silently. Run them explicitly.
      - run: cargo test --doc

  # The declared MSRV has to actually build and test, or it silently drifts the
  # first time someone uses a newer API.
  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo test --all-targets

  # Every feature combination must compile. `--no-default-features` matters
  # most: it is the pure-Rust `lz4_flex` decode path that the Python wheels
  # used to ship, and nothing else in CI exercises it at the Rust level.
  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: features
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack --feature-powerset --no-dev-deps check
      # Test the two combinations that carry real signal, rather than the whole
      # powerset (which would multiply test time for little extra coverage).
      - run: cargo test --no-default-features
      - run: cargo test --all-features

  # Supply chain: advisories, licences, duplicate/banned crates, and sources.
  # The crate links a C dependency (`lz4-sys`) plus a dozen transitive crates.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # The fuzz targets are built with nightly and are not part of `cargo test`,
  # so nothing else would notice them going stale (an API change in the crate
  # breaks them silently). Build them; running the fuzzer is a manual job.
  fuzz:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz
      # Not the `@<tool>` ref shorthand: install-action's `cargo-fuzz` tag still
      # points at the March 2024 action, which installs nothing *and exits 0* —
      # the install step reads green and the next one dies with "no such
      # command: fuzz". Pin the major tag and name the tool explicitly.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # `--target` is not optional here. The prebuilt cargo-fuzz is a
      # musl-static binary, and cargo-fuzz defaults the target to its *own*
      # build triple — so it would try to cross-compile the fuzz targets to
      # musl, where the target is not installed and ASan cannot link against a
      # static libc. Build for the host instead.
      - run: |
          cargo +nightly fuzz build --target "$(rustc +nightly -vV | sed -n 's/^host: //p')"

  # The version appears in six files plus the changelog, and only `tag-check`
  # (tag vs pyproject, at release time) ever compared any of them. 0.2.1 shipped
  # with a stale badge in the PyPI description because of exactly that gap, so
  # the invariant is enforced on every PR now, not just at release.
  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/release.py check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The 13 py/examples/*.py are the first thing a new user runs, and nothing
  # executed them — the Rust examples have had a smoke-run for ages. Each is
  # written to work against the bundled sample with no arguments.
  # The binding is built here *and* its test suite run. Building alone is not
  # enough: a commit once deleted six `ColumnData::push_*` methods that only
  # `py/` uses, and the wheel build caught it — but the Python tests, which
  # were not run at all, are what pin the binding's *behaviour*. `cargo test`
  # at the repo root does not build `py/`, and `cargo test` inside `py/`
  # cannot link, because pyo3's `extension-module` is unconditional there.
  # pytest is the only gate this crate's logic has.
  python:
    name: python binding (tests + examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: py-examples
      - name: Build and install the binding
        run: |
          python -m pip install --upgrade pip maturin pytest -q
          (cd py && maturin build --release --out dist)
          python -m pip install -q py/dist/*.whl
      - name: Clippy the binding
        run: cargo clippy --manifest-path py/Cargo.toml --all-targets
      - name: Run the test suite
        run: python -m pytest py/tests -q
      - name: Run every example
        run: |
          fail=0
          for f in py/examples/*.py; do
            case "$(basename "$f")" in
              # needs ROOT (not on PyPI); benchmarks are slow and not assertions
              rdataframe.py|bench_*.py) echo "skip $f"; continue;;
            esac
            echo "== $f"
            python "$f" >/dev/null || { echo "FAILED: $f"; fail=1; }
          done
          exit $fail

  # High-level smoke test: `cargo test` compiles the examples but never runs
  # them, so a runtime break (panic, bad logic) ships silently. Drive the core
  # examples end-to-end — write → read → recook to Lz4PerBank → read back,
  # tag-and-skim round-trip, plus a small all-format encode/read sweep.
  examples:
    name: smoke-run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: examples
      - name: Smoke-run examples
        run: |
          cargo run --example write -- /tmp/demo.hipo
          cargo run --example read -- /tmp/demo.hipo
          cargo run --example recook_by_bank -- /tmp/demo.hipo /tmp/demo_bybank.hipo
          cargo run --example read -- /tmp/demo_bybank.hipo
          cargo run --example tag_and_skim -- /tmp/tagdemo
          cargo run --example bench_read_compression -- 3000 1
